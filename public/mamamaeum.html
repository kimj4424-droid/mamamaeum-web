<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>엄마마음</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FFFFFF;
    --room-bg:#B2C7DA;
    --header-bg:#FFFFFF;
    --header-fg:#191919;
    --header-border:#E7E7E7;
    --plum:#191919;
    --plum-dark:#000000;
    --incoming-bg:#FFFFFF;
    --incoming-border:rgba(0,0,0,0.05);
    --yellow:#FEE500;
    --yellow-deep:#E6CE00;
    --draft-gray:#E5E5E5;
    --draft-gray-border:#D6D6D6;
    --text-main:#191919;
    --text-muted:#8C8C8C;
    --danger-bg:#FDEDED;
    --danger-border:#F2C6C6;
    --radius:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    font-family:'Noto Sans KR',sans-serif;
    color:var(--text-main);
    display:flex;
    justify-content:center;
    min-height:100vh;
  }
  #app{
    width:100%;
    max-width:420px;
    min-height:100vh;
    background:var(--paper);
    display:flex;
    flex-direction:column;
    box-shadow:0 0 40px rgba(0,0,0,0.06);
  }
  .chat-header{
    background:var(--header-bg);
    color:var(--header-fg);
    padding:16px 20px 12px;
    position:sticky;
    top:0;
    z-index:5;
    border-bottom:1px solid var(--header-border);
  }
  .chat-header .brand{
    font-family:'Noto Sans KR',sans-serif;
    font-size:19px;
    font-weight:800;
    letter-spacing:-0.01em;
  }
  .chat-header .tagline{
    font-size:12px;
    color:var(--text-muted);
    margin-top:3px;
  }
  .tabs{
    display:flex;
    background:#fff;
    padding:0 20px;
    gap:22px;
    position:sticky;
    top:57px;
    z-index:5;
    border-bottom:1px solid var(--header-border);
  }
  .tab-btn{
    padding:11px 2px;
    border:none;
    border-radius:0;
    border-bottom:3px solid transparent;
    background:none;
    color:var(--text-muted);
    font-family:'Noto Sans KR',sans-serif;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    transition:color .15s ease, border-color .15s ease;
  }
  .tab-btn:focus-visible{outline:2px solid var(--yellow-deep);outline-offset:2px;}
  .tab-btn.active{
    color:var(--text-main);
    border-bottom-color:var(--yellow);
    font-weight:800;
  }
  #screen-root{
    flex:1;
    padding:18px 16px 40px;
    display:flex;
    flex-direction:column;
    gap:14px;
    background:var(--room-bg);
  }
  .lead{font-size:14.5px;line-height:1.6;color:var(--text-main);}
  .lead-hero-card{
    background:linear-gradient(160deg,#FFF6EA 0%,#FCEEE0 100%);
    border-radius:26px;
    padding:17px 12px 16px;
    box-shadow:0 4px 16px rgba(200,150,90,0.14);
    display:flex;
    flex-direction:column;
    gap:9px;
    text-align:center;
  }
  .lead-hero-line1{
    font-size:13.5px;
    font-weight:500;
    color:#B08A5A;
    line-height:1.6;
    letter-spacing:0.01em;
  }
  .lead-hero-line2{
    font-size:19px;
    font-weight:700;
    color:#5C4A34;
    line-height:1.55;
    letter-spacing:-0.005em;
  }
  textarea.msg-input{
    width:100%;
    min-height:130px;
    border-radius:14px;
    border:1.5px solid var(--incoming-border);
    background:var(--incoming-bg);
    padding:14px;
    font-family:'Noto Sans KR',sans-serif;
    font-size:14.5px;
    line-height:1.6;
    resize:vertical;
    color:var(--text-main);
  }
  textarea.msg-input:focus-visible{outline:2px solid var(--plum);outline-offset:1px;}
  .privacy-line{
    font-size:12px;
    color:var(--text-muted);
  }
  .char-counter{
    font-size:11.5px;
    color:var(--text-muted);
    text-align:right;
  }
  .char-counter.warn{color:#B4552C;}
  .example-heading{
    font-size:12px;
    color:var(--text-muted);
    font-weight:600;
    margin-top:2px;
  }
  .example-list{
    display:flex;
    flex-direction:column;
    gap:9px;
  }
  .example-item{
    display:block;
    width:100%;
    text-align:left;
    padding:11px 13px;
    border-radius:16px;
    border-bottom-left-radius:4px;
    border:none;
    background:#fff;
    box-shadow:0 1px 2px rgba(0,0,0,0.08);
    cursor:pointer;
    font-family:'Noto Sans KR',sans-serif;
  }
  .example-item.out{
    border-bottom-left-radius:16px;
    border-bottom-right-radius:4px;
    background:#FFFBEA;
    border:1px solid #F2E7A8;
  }
  .example-item .ex-text{
    font-size:13px;
    line-height:1.5;
    color:var(--text-main);
  }
  .example-item .ex-note{
    font-size:11px;
    color:var(--text-muted);
    margin-top:6px;
  }
  .example-item:focus-visible{outline:2px solid var(--yellow-deep);outline-offset:2px;}
  .example-item:active{transform:scale(0.99);}
  .primary-btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:14px;
    background:var(--plum);
    color:#fff;
    font-family:'Noto Sans KR',sans-serif;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    transition:transform .1s ease, opacity .15s ease;
  }
  .primary-btn:disabled{opacity:0.4;cursor:not-allowed;}
  .primary-btn:not(:disabled):active{transform:scale(0.98);}
  .primary-btn:focus-visible{outline:2px solid var(--plum-dark);outline-offset:2px;}
  .ghost-btn{
    width:100%;
    padding:12px;
    border-radius:14px;
    border:1.5px solid var(--incoming-border);
    background:var(--incoming-bg);
    color:var(--text-main);
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    font-family:'Noto Sans KR',sans-serif;
  }
  .skip-link{
    text-align:center;
    font-size:13px;
    color:var(--text-muted);
    text-decoration:underline;
    background:none;
    border:none;
    cursor:pointer;
    padding:6px;
    font-family:'Noto Sans KR',sans-serif;
  }

  /* --- measure screen --- */
  .measure-card{
    background:var(--incoming-bg);
    border:none;
    box-shadow:0 1px 2px rgba(0,0,0,0.08);
    border-radius:var(--radius);
    padding:20px;
    text-align:center;
  }
  .measure-scale{
    display:flex;
    justify-content:space-between;
    gap:6px;
    margin:16px 0 4px;
  }
  .scale-btn{
    flex:1;
    aspect-ratio:1;
    border-radius:50%;
    border:1.5px solid var(--incoming-border);
    background:#fff;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
    color:var(--text-main);
  }
  .scale-btn.selected{
    background:var(--yellow);
    border-color:var(--yellow-deep);
  }
  .scale-labels{
    display:flex;
    justify-content:space-between;
    font-size:10.5px;
    color:var(--text-muted);
    padding:0 2px;
  }

  /* --- loading --- */
  .loading-wrap{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:60px 20px;
    gap:14px;
    color:var(--text-muted);
    font-size:13.5px;
  }
  .spinner{
    width:30px;height:30px;
    border-radius:50%;
    border:3px solid var(--incoming-border);
    border-top-color:var(--plum);
    animation:spin .9s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  /* --- bubbles --- */
  .bubble-row{display:flex;margin:2px 0;}
  .bubble-row.left{justify-content:flex-start;}
  .bubble-row.right{justify-content:flex-end;}
  .bubble{
    max-width:82%;
    padding:12px 14px;
    border-radius:16px;
    font-size:14px;
    line-height:1.6;
    white-space:pre-wrap;
    word-break:break-word;
    animation:pop .28s ease;
  }
  @keyframes pop{from{opacity:0;transform:translateY(6px) scale(0.98);}to{opacity:1;transform:none;}}
  .bubble.incoming{
    background:var(--incoming-bg);
    border:none;
    box-shadow:0 1px 2px rgba(0,0,0,0.08);
    border-bottom-left-radius:4px;
  }
  .bubble.draft{
    background:var(--draft-gray);
    border:1.5px solid var(--draft-gray-border);
    border-bottom-right-radius:4px;
    color:#4A4A4A;
  }
  .bubble-caption{
    font-size:11px;
    color:var(--text-muted);
    margin:2px 4px;
  }
  .bubble-row.left .bubble-caption{text-align:left;}
  .bubble-row.right .bubble-caption{text-align:right;}

  .card{
    background:var(--incoming-bg);
    border:none;
    box-shadow:0 1px 2px rgba(0,0,0,0.08);
    border-radius:var(--radius);
    padding:16px;
  }
  .card-title{
    font-family:'Noto Sans KR',sans-serif;
    font-size:15.5px;
    font-weight:800;
    margin:0 0 8px;
  }
  .card-body{font-size:13.8px;line-height:1.65;color:var(--text-main);}
  .evidence-line{
    margin-top:10px;
    padding:8px 10px;
    background:var(--paper);
    border-radius:10px;
    font-size:12.5px;
    color:#6E5F53;
  }
  .caution-card{
    background:var(--danger-bg);
    border:1.5px solid var(--danger-border);
  }
  .badge{
    display:inline-block;
    font-size:11px;
    padding:4px 10px;
    border-radius:999px;
    background:#EDE6F1;
    color:var(--plum-dark);
    font-weight:700;
    align-self:flex-start;
  }

  .reply-card{
    background:var(--yellow);
    border-radius:var(--radius);
    border-bottom-right-radius:4px;
    padding:14px;
    display:flex;
    flex-direction:column;
    gap:8px;
    animation:pop .32s ease;
  }
  .reply-card.draft-yellow{border-bottom-right-radius:var(--radius);}
  .reply-label{
    font-size:12.5px;
    font-weight:700;
    color:#191919;
  }
  .reply-text{
    font-size:14px;
    line-height:1.65;
    background:rgba(255,255,255,0.55);
    border-radius:10px;
    padding:10px;
    outline:none;
    color:#191919;
  }
  .reply-text:focus-visible{outline:2px solid var(--plum-dark);}
  .outcome-line{
    font-size:12px;
    color:#5C5333;
  }
  .reply-actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    align-items:center;
    margin-top:2px;
  }
  .icon-btn{
    padding:6px 11px;
    border-radius:999px;
    border:1.3px solid rgba(0,0,0,0.28);
    background:rgba(255,255,255,0.5);
    font-size:12px;
    font-weight:600;
    color:#191919;
    cursor:pointer;
    font-family:'Noto Sans KR',sans-serif;
  }
  .icon-btn:disabled{opacity:0.5;cursor:wait;}
  .rating-row{
    display:flex;
    align-items:center;
    gap:5px;
    margin-left:auto;
  }
  .rating-btn{
    width:22px;height:22px;
    border-radius:50%;
    border:1.3px solid rgba(0,0,0,0.25);
    background:rgba(255,255,255,0.4);
    font-size:10.5px;
    cursor:pointer;
    color:#191919;
    padding:0;
  }
  .rating-btn.selected{background:#191919;color:var(--yellow);}
  .copy-toast{
    font-size:11px;
    color:#5C5333;
    display:none;
  }
  .copy-toast.show{display:inline;}

  /* --- feedback --- */
  .cat-row{display:flex;gap:8px;flex-wrap:wrap;}
  .cat-btn{
    padding:8px 14px;
    border-radius:999px;
    border:1.5px solid var(--incoming-border);
    background:#fff;
    font-size:13px;
    font-weight:600;
    color:var(--text-main);
    cursor:pointer;
    font-family:'Noto Sans KR',sans-serif;
  }
  .cat-btn.selected{background:var(--yellow);border-color:var(--yellow-deep);}
  .feedback-success{
    background:var(--incoming-bg);
    border-radius:var(--radius);
    box-shadow:0 1px 2px rgba(0,0,0,0.08);
    padding:28px 20px;
    text-align:center;
  }

  .footer-note{
    font-size:11px;
    color:var(--text-muted);
    text-align:center;
    margin-top:8px;
    line-height:1.6;
  }
  .fallback-badge{
    font-size:11.5px;
    color:#8A5A2A;
    background:#FBF0DE;
    border:1px solid #EAD3A6;
    padding:6px 10px;
    border-radius:10px;
    text-align:center;
  }
  .live-badge{
    font-size:11.5px;
    color:#2E5C46;
    background:#E7F3EC;
    border:1px solid #BFE0CE;
    padding:6px 10px;
    border-radius:10px;
    text-align:center;
  }
  .safety-badge{
    font-size:11.5px;
    color:#5C4413;
    background:#F3EAD2;
    border:1px solid #E0CE9F;
    padding:6px 10px;
    border-radius:10px;
    text-align:center;
  }
  .error-hint{
    font-size:11.5px;
    color:#B4552C;
  }
  @media (prefers-reduced-motion: reduce){
    .bubble,.reply-card,.spinner{animation:none;}
  }
</style>
</head>
<body>
<div id="app">
  <div class="chat-header">
    <div class="brand">엄마마음</div>
    <div class="tagline">부모님과 나 사이, 보낼 수 있는 문장으로</div>
  </div>
  <div class="tabs">
    <button class="tab-btn" id="tab-out" onclick="switchMode('out')">하고 싶은 말</button>
    <button class="tab-btn" id="tab-in" onclick="switchMode('in')">받은 메시지</button>
    <button class="tab-btn" id="tab-feedback" onclick="switchMode('feedback')">피드백</button>
  </div>
  <div id="screen-root"></div>
</div>

<script>
/* ============================================================
   설정
============================================================ */
const MODEL = "claude-sonnet-4-6";
const MAX_TOKENS = 1000;
const CALL_TIMEOUT_MS = 16000;
const REGEN_TIMEOUT_MS = 12000;

/* ============================================================
   상태
============================================================ */
const state = {
  mode: 'out',           // 'in' | 'out' | 'feedback'
  screen: 'input',        // 'input' | 'measure' | 'loading' | 'result' | 'refusal' | 'safety' | 'feedback'
  inputText: '',
  truncated: false,
  preScore: null,
  pendingPromise: null,
  result: null,           // {source:'keyword'|'llm'|'fallback', data:{...}}
  ratings: {},            // {in: {"따뜻하게":avg,...}, out:{...}}
  ratingCounts: {},
  feedback: { category:null, message:'', contact:'', sending:false, sent:false, error:'' }
};

/* ============================================================
   판정용 키워드 (LLM 호출 전 결정론적 세이프넷)
============================================================ */
const REFUSAL_KEYWORDS = ['교회','주일','예배','성당','부처님','하나님','결혼','시집','장가','선거','정당','투표'];

const SAFETY_KEYWORDS = {
  selfharm: ['자해','죽고 싶다','죽고싶다','사라지고 싶다','살기 싫다'],
  abuse: ['때리','폭행','감금','협박'],
  extortion: ['돈 좀 보내','생활비 대','돈을 뜯','빚 갚아','돈 내놔'],
  estrangement: ['절연','손절']
};

function findRefusalKeyword(text){
  return REFUSAL_KEYWORDS.find(k => text.includes(k)) || null;
}
function findSafetyCategory(text){
  for (const [cat, words] of Object.entries(SAFETY_KEYWORDS)){
    if (words.some(w => text.includes(w))) return cat;
  }
  return null;
}

/* ============================================================
   예시 칩
============================================================ */
const INBOUND_CHIPS = [
  {text:'이번 주말에 큰집 제사인데 너는 온다는 건지 안 온다는 건지 말을 안 하는구나. 작년에도 너 혼자 안 와서 친척들이 다 물어보고 갔다. 이번엔 꼭 얼굴 좀 비춰라.',
   note:'"이건 어때요"가 참석 대신 다른 대안을 주는지 확인하는 예시예요.'},
  {text:'요즘 왜 이렇게 연락이 없니. 전화도 안 받고 톡도 씹고, 무슨 일 있는 건 아니지? 옆집 아들은 매일 전화한다더라, 너도 좀 그렇게 하면 안 되겠니.',
   note:'비교에 동의하지 않고, 사과 없이 답장하는지 확인하는 예시예요.'}
];
const OUTBOUND_CHIPS = [
  {text:'용돈 얘기 그만 좀 하셨으면 좋겠어요. 저도 빠듯해요.',
   note:'다듬는 과정에서 요구 자체가 흐려지지 않는지 확인하는 예시예요.'},
  {text:'취업 얘기 좀 그만 물어봤으면 좋겠어. 나도 나름대로 열심히 하고 있는데 자꾸 물어보면 더 초조해져',
   note:'감정은 살리되 죄책감을 유발하는 표현 없이 다듬는지 확인하는 예시예요.'}
];

/* ============================================================
   시스템 프롬프트 (7장·17장 초안을 19장 개정으로 패치)
============================================================ */
const INBOUND_SYSTEM = `너는 성인 자녀가 부모에게 받은 카카오톡 메시지에 답장할 수 있도록 돕는 도구다.
부모를 변호하는 게 아니라, 자녀가 답장을 보낼 수 있게 만드는 것이 목적이다.

[읽기 규칙]
- 원문에 실제로 있는 표현만 근거로 삼는다. 없는 사건, 감정, 요구를 만들어내지 않는다.
- '외롭다', '상처받았다', '서운하다' 같은 감정은 원문에 그 단어나 명확한 표현이 없으면 쓰지 않는다.
- '진짜 마음', '사실은' 같은 단정 표현을 쓰지 않는다. '~였을 수도 있어요' 식으로 조심스럽게 쓴다.
- confidence가 high일 때 reading은 두 문장으로 쓴다: 1) 자녀 감정에 대한 공감 1문장, 2) 부모의 표현은 서투르지만 그 안에 있을 법한 진의 1문장.
- evidence는 원문에서 실제로 걸리는 비교·비난조 표현을 그대로 짧게 인용한다.
- 다음 경우 confidence를 low로 하고 reading·evidence는 null로, caution에 이유를 한 문장으로 쓴다:
  (1) 단순 정보 전달/홍보/링크 공유라 개인적 의도를 읽을 근거가 없을 때
  (2) 종교·정치·결혼·출산·취업 등 가치관 요구가 핵심이어서, 따뜻하게 해석하면 그 요구에 동의하는 것처럼 보여 자녀에게 압박이 될 때
  (3) 원문이 부모가 자녀에게 보낸 사적인 메시지로 보이지 않을 때 (업무 메시지, 제3자 간 대화 등)
  (4) 원문이 20자 미만이고 맥락이 없을 때

[답장 규칙 — 3개는 "온도"가 아니라 "전략"이 다른 답장이다]
라벨을 가리고 읽어도 세 답장이 서로 구분돼야 한다. 아래 구조를 각각 반드시 지켜라.

- "따뜻하게" — 관계만 돌본다. 요구·갈등 주제를 아예 언급하지 않는다.
  · 시작은 반가움·그리움 같은 감정 반응으로 연다.
  · "대신", "그런데", "다만" 같은 전환어를 쓰지 않는다 — 무엇과 무엇을 맞바꾸는 문장이 아니기 때문이다.
  · 일정·약속을 잡지 않는다. 이 답장만 읽으면 부모가 무엇을 요청했는지 짐작할 수 없어야 한다.

- "이건 어때요" — 협상이다. 아래 순서를 그대로 따른다.
  ① 요구를 짧게 인정하며 거절을 선언 → ② "대신"으로 시작하는 구체적 대안 → ③ 그 대안이 부모의 진짜 필요(체면·안심·소식 등)를 어떻게 채우는지 한 문장
  · "대신"(또는 동급 전환어)이 반드시 들어간다. 새 날짜·시각을 확정하지 않는다("조만간", "이번 달 안에" 같은 불특정 시점은 허용).
  · 3개 중 유일하게 새로운 행동을 약속하는 답장이다.

- "지금은 어려워요" — 경계를 긋는다. 협상하지도, 위로하지도 않는다.
  · 이유 설명은 한 문장을 넘지 않는다.
  · "대신"이나 대안을 절대 넣지 않는다 — 하나라도 있으면 "이건 어때요"와 구분이 안 된다.
  · "나중에", "곧", "다시 말씀드릴게요" 같은 새 약속을 만들지 않는다. 3개 중 가장 짧고 단호하게, 다음 대화를 열지 않는 문장으로 끝난다.

- confidence가 low일 때도 replies는 3개를 채우되, 전부 가치관 질문에는 답하지 않는 안부형으로 쓴다. 이때도 위 세 구조(관계만/협상/경계)는 그대로 지킨다 — 예: "이건 어때요"는 가치관 주제 대신 통화·안부 같은 다른 연결 방식을 "대신"으로 제안한다.
- 각 답장은 4~5문장으로, 실제로 그대로 보낼 수 있을 만큼 구체적으로 쓴다.
- 사과·자책 표현을 쓰지 않는다. 부모의 비난을 사실로 인정하는 문장("연락이 뜸했네요", "요즘 정신없이 지내서")도 자책으로 본다 — 쓰지 않는다.
- 부모의 비교·비난에 동의하지 않는다.
- 20~30대가 실제로 부모에게 쓰는 카톡 말투(해요체)로 쓴다. 문어체, 상담 어투, 이모지를 쓰지 않는다.
- 각 답장에 outcome을 한 문장으로 쓴다. "이 답장을 보내면 → " 뒤에 올 내용만 담백하게 쓴다 (그 문구 자체는 쓰지 않는다).
- 세 답장을 다 쓴 뒤 스스로 점검한다: "따뜻하게"에 요구/갈등 주제 단어가 없는가, "이건 어때요"에 "대신"이 있는가, "지금은 어려워요"에 "대신"이나 새 약속이 없는가. 하나라도 아니면 다시 써라.

[출력]
아래 JSON 객체 하나만 출력한다. 설명, 코드블록 표시(백틱), 그 외 텍스트를 절대 붙이지 않는다.
{"confidence":"high"|"low","reading":string|null,"evidence":string|null,"caution":string|null,
 "replies":[{"type":"따뜻하게","text":string,"outcome":string},
            {"type":"이건 어때요","text":string,"outcome":string},
            {"type":"지금은 어려워요","text":string,"outcome":string}]}`;

const OUTBOUND_SYSTEM = `너는 성인 자녀가 부모에게 하지 못한 말을 실제로 보낼 수 있는 문장으로 바꾸는 도구다.
사용자를 대신해 말해주는 게 아니라, 사용자가 이미 하려던 말을 전달 가능하게 만드는 것이 목적이다.

[다듬기 규칙]
- 사용자의 요구를 약화시키지 않는다. 요구의 내용과 강도를 유지한 채 표현만 바꾼다.
- 원문의 어조(격식·직설성·감정 강도)도 함께 보존한다. 다만 정중체(해요체)는 유지한다.
- 사과와 자책을 새로 넣지 않는다. 사용자가 쓰지 않은 "죄송해요"를 만들어내지 않는다.
- 죄책감을 유발하는 표현을 쓰지 않는다("엄마 때문에", "나를 이렇게 만든" 등 금지).
- 심리학 용어와 진단을 쓰지 않는다("가스라이팅", "통제적", "독성" 등 금지).
- 원문에 없는 과거 사건이나 임의의 날짜·대안 일정을 만들지 않는다.
- 최후통첩이나 관계 단절 선언을 생성하지 않는다.
- 20~30대가 실제로 부모에게 쓰는 카톡 말투(해요체)로 쓴다. 문어체, 상담 어투, 이모지를 쓰지 않는다.
- 각 문장은 4~5문장으로 쓴다.
- 각 문장마다 heard_as를 한 문장으로 쓴다: 받는 부모 입장에서 그 문장이 어떻게 들릴지, 미화하지 않고 담백하게.

[세 문장은 "순화 정도"가 아니라 "구조"가 다른 문장이다]
라벨을 가리고 읽어도 세 문장이 서로 구분돼야 한다. 아래 구조를 각각 반드시 지켜라.

- "부드럽게" — 요구 앞에 완충 문장을 둔다. 첫 문장은 자기 상황이나 상대 입장을 살짝 인정하며 부드럽게 연다. 요구 자체는 그대로 담되, 왜 이게 나에게 중요한지는 설명하지 않는다(그건 "마음을 담아"의 몫이다).
- "분명하게" — 완충 문장이 전혀 없다. 첫 문장부터 바로 요구/결정을 말한다. 감정 표현이나 배경 설명 없이, 3개 중 가장 짧고 사무적으로 쓴다.
- "마음을 담아" — "이게 나에게 왜 중요한지"를 설명하는 문장이 반드시 1개 이상 들어간다. 이 설명은 다른 두 문장에는 없어야 한다. 나-전달법을 쓰되 죄책감을 유발하지 않는다.
- 세 문장을 다 쓴 뒤 스스로 점검한다: "부드럽게"에 여는 완충 문장이 있는가, "분명하게"는 첫 문장부터 바로 본론인가, "마음을 담아"에만 "왜 중요한지" 설명이 있는가. 하나라도 아니면 다시 써라.

[safe=false 처리]
학대, 금전 갈취, 절연 결심, 자해 암시가 섞인 입력은 문장을 다듬어 주지 않는다.
safe를 false로 하고, caution에 "카톡 한 통으로 정리될 문제가 아닐 수 있다"는 취지를 담아 쓰고,
messages는 관계를 닫지 않는 최소한의 문장 1개만 담되 2문장 이내로 짧게 쓴다(4~5문장 규칙의 예외).

[출력]
아래 JSON 객체 하나만 출력한다. 설명, 코드블록 표시(백틱), 그 외 텍스트를 절대 붙이지 않는다.
{"safe":true|false,"caution":string|null,
 "messages":[{"type":"부드럽게","text":string,"heard_as":string},
             {"type":"분명하게","text":string,"heard_as":string},
             {"type":"마음을 담아","text":string,"heard_as":string}]}
(safe가 false면 messages는 1개만, type은 자유롭게 짧은 라벨을 붙인다)`;

/* ============================================================
   API 호출
============================================================ */
function stripFence(raw){
  let s = raw.trim();
  s = s.replace(/^```json\s*/i,'').replace(/^```\s*/,'').replace(/```\s*$/,'');
  return s.trim();
}

async function callClaude(system, messages, timeoutMs){
  const controller = new AbortController();
  const timer = setTimeout(()=>controller.abort(), timeoutMs);
  try{
    const res = await fetch("/api/translate", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      signal: controller.signal,
      body: JSON.stringify({
        model: MODEL,
        max_tokens: MAX_TOKENS,
        system: system,
        messages: messages
      })
    });
    if (!res.ok) throw new Error("API "+res.status);
    const data = await res.json();
    const block = (data.content||[]).find(b=>b.type==="text");
    if (!block) throw new Error("응답에 텍스트가 없어요");
    return JSON.parse(stripFence(block.text));
  } finally {
    clearTimeout(timer);
  }
}

function validateInbound(json){
  if (!json || typeof json!=='object') return false;
  if (!('confidence' in json) || !Array.isArray(json.replies) || json.replies.length!==3) return false;
  return json.replies.every(r=>r && r.type && r.text && r.outcome);
}
function validateOutbound(json){
  if (!json || typeof json!=='object') return false;
  if (!('safe' in json) || !Array.isArray(json.messages) || json.messages.length<1) return false;
  return json.messages.every(m=>m && m.type && m.text && m.heard_as);
}

function buildFewshotMessages(fewshot, framing, text){
  const msgs = [];
  fewshot.forEach(ex=>{
    msgs.push({role:"user", content: framing + '\n"""'+ex.user+'"""'});
    msgs.push({role:"assistant", content: JSON.stringify(ex.assistant)});
  });
  msgs.push({role:"user", content: framing + '\n"""'+text+'"""'});
  return msgs;
}

async function runGeneration(mode, text){
  if (mode==='in'){
    // 종교·결혼·정치 키워드는 더 이상 API 호출 전에 즉시 차단하지 않는다.
    // few-shot이 이미 이 경우 confidence:"low"를 내도록 가르쳐 뒀으므로,
    // 실제 판단은 AI가 하게 두고(데모 신뢰도↑), 키워드는 "API 실패 시 어떤 폴백을 보여줄지"만 결정한다.
    const t0 = performance.now();
    try{
      const msgs = buildFewshotMessages(INBOUND_FEWSHOT, "다음은 부모님이 보낸 카카오톡 메시지야:", text);
      const json = await callClaude(INBOUND_SYSTEM, msgs, CALL_TIMEOUT_MS);
      if (!validateInbound(json)) throw new Error("스키마 불일치");
      return {source:'llm', data: json, elapsedMs: Math.round(performance.now()-t0)};
    }catch(e){
      const kw = findRefusalKeyword(text);
      return {source:'fallback', data: kw ? FALLBACK_REFUSAL_IN : FALLBACK_IN};
    }
  } else {
    const cat = findSafetyCategory(text);
    if (cat){
      return {source:'keyword', data: {safe:false, caution:SAFETY_MESSAGE[cat].caution, messages:[{type:"최소한의 말", text:SAFETY_MESSAGE[cat].text, heard_as:"다 설명하지 않아도, 대화를 완전히 끊지는 않는 정도로 들릴 수 있어요"}]}};
    }
    const t0 = performance.now();
    try{
      const msgs = buildFewshotMessages(OUTBOUND_FEWSHOT, "다음은 사용자가 부모님께 하고 싶은데 아직 못 한 말이야. 정리되지 않은 날것 그대로야:", text);
      const json = await callClaude(OUTBOUND_SYSTEM, msgs, CALL_TIMEOUT_MS);
      if (!validateOutbound(json)) throw new Error("스키마 불일치");
      return {source:'llm', data: json, elapsedMs: Math.round(performance.now()-t0)};
    }catch(e){
      return {source:'fallback', data: FALLBACK_OUT};
    }
  }
}

/* 단일 카드 재생성 */
async function regenerateOne(mode, originalText, cardType, variantHint){
  const system = mode==='in'
    ? INBOUND_SYSTEM + '\n\n[지금 요청]\n답장 라벨 하나만 새로 써서 아래 JSON 하나만 출력해라. 이전에 나온 것과는 다른 표현으로 써라.\n{"text":string,"outcome":string}'
    : OUTBOUND_SYSTEM + '\n\n[지금 요청]\n문장 라벨 하나만 새로 써서 아래 JSON 하나만 출력해라. 이전에 나온 것과는 다른 표현으로 써라.\n{"text":string,"heard_as":string}';
  const userMsg = mode==='in'
    ? `부모님이 보낸 메시지: """${originalText}"""\n\n이 메시지에 대해 "${cardType}" 답장을 새로 하나 써줘. ${variantHint||''}`
    : `사용자가 하고 싶은 말: """${originalText}"""\n\n이 말을 "${cardType}"로 새로 하나 다듬어줘. ${variantHint||''}`;
  const json = await callClaude(system, [{role:"user", content:userMsg}], REGEN_TIMEOUT_MS);
  return json;
}

const root = document.getElementById('screen-root');

function switchMode(mode){
  state.mode = mode;
  state.screen = mode==='feedback' ? 'feedback' : 'input';
  state.inputText = '';
  state.truncated = false;
  state.preScore = null;
  state.pendingPromise = null;
  state.result = null;
  render();
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s==null ? '' : String(s);
  return d.innerHTML;
}

function render(){
  document.getElementById('tab-in').classList.toggle('active', state.mode==='in');
  document.getElementById('tab-out').classList.toggle('active', state.mode==='out');
  document.getElementById('tab-feedback').classList.toggle('active', state.mode==='feedback');

  if (state.screen==='feedback') return renderFeedbackScreen();
  if (state.screen==='input') return renderInputScreen();
  if (state.screen==='measure') return renderMeasureScreen();
  if (state.screen==='loading') return renderLoadingScreen();
  if (state.screen==='result') return renderResultScreen();
  if (state.screen==='refusal') return renderRefusalScreen();
  if (state.screen==='safety') return renderSafetyScreen();
}

const FEEDBACK_CATEGORIES = ['버그 신고','기능 제안','아쉬운 점','좋았던 점'];

function renderFeedbackScreen(){
  const fb = state.feedback;

  if (fb.sent){
    root.innerHTML = `
      <div class="feedback-success">

        <div class="card-body">베타 기간 동안 남겨주신 의견은 다음 업데이트에 반영할게요.</div>
      </div>
      <button class="ghost-btn" id="fb-again">의견 하나 더 남기기</button>
    `;
    document.getElementById('fb-again').addEventListener('click', ()=>{
      state.feedback = { category:null, message:'', contact:'', sending:false, sent:false, error:'' };
      render();
    });
    return;
  }

  root.innerHTML = `
    <div class="lead">베타 사용 중 불편했던 점이나 제안을 남겨주세요. 화면에 나온 답장 품질, 오류, 아이디어 모두 좋아요.</div>
    <div class="example-heading">어떤 종류의 의견인가요? (선택)</div>
    <div class="cat-row" id="fb-cats">
      ${FEEDBACK_CATEGORIES.map(c=>`<button class="cat-btn${fb.category===c?' selected':''}" data-cat="${escapeHtml(c)}">${escapeHtml(c)}</button>`).join('')}
    </div>
    <textarea class="msg-input" id="fb-message" placeholder="어떤 부분이 불편했는지, 무엇이 있었으면 좋을지 편하게 적어주세요">${escapeHtml(fb.message)}</textarea>
    <input class="msg-input" id="fb-contact" style="min-height:auto;padding:12px 14px;" placeholder="답변 받을 연락처 (선택, 이메일 등)" value="${escapeHtml(fb.contact)}" />
    <div class="privacy-line">남겨주신 의견은 서비스 개선 목적으로만 사용해요.</div>
    <button class="primary-btn" id="fb-submit">의견 보내기</button>
    <div id="fb-error" class="error-hint">${escapeHtml(fb.error)}</div>
  `;

  document.getElementById('fb-cats').querySelectorAll('.cat-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      fb.category = fb.category===btn.dataset.cat ? null : btn.dataset.cat;
      render();
    });
  });
  document.getElementById('fb-message').addEventListener('input', e=>{ fb.message = e.target.value; });
  document.getElementById('fb-contact').addEventListener('input', e=>{ fb.contact = e.target.value; });

  document.getElementById('fb-submit').addEventListener('click', async ()=>{
    const errEl = document.getElementById('fb-error');
    if (!fb.message.trim()){ errEl.textContent = '내용을 적어주세요'; return; }
    if (fb.sending) return;

    btn.disabled = true;
    btn.textContent = '보내는 중…';
    try{
      const res = await fetch('/api/feedback', {
        method:'POST',
        headers:{'Content-Type':'application/json'},

      render();

      btn.disabled = false;
      btn.textContent = '의견 보내기';
      errEl.textContent = '전송에 실패했어요. 잠시 후 다시 시도해주세요.';
    }
  });
}

function renderInputScreen(){
  const isIn = state.mode==='in';
  const chips = isIn ? INBOUND_CHIPS : OUTBOUND_CHIPS;
  const leadBlock = isIn
    ? `<div class="lead">부모님께 받은 카톡을 그대로 붙여넣어 주세요.</div>`
    : `<div class="lead-hero-card">
        <div class="lead-hero-line1">부모님께 못 한 말이 있나요?</div>
        <div class="lead-hero-line2">메세지는 엄마마음이 써드릴게요.</div>
      </div>`;
  const placeholder = isIn ? '여기에 부모님 메시지를 붙여넣어 주세요' : '정리 안 된 채로 괜찮아요. 욕이 섞여도 돼요.';
  const btnLabel = isIn ? '읽어보기' : '보낼 수 있게 다듬기';
  const privacy = isIn
    ? '입력한 메시지는 저장하지 않아요.'
    : '정리 안 된 채로 괜찮아요. 저장하지 않습니다.';

  root.innerHTML = `
    ${leadBlock}
    <textarea class="msg-input" id="msg-input" placeholder="${placeholder}">${escapeHtml(state.inputText)}</textarea>
    <div class="char-counter" id="char-counter"></div>
    <div class="privacy-line">${privacy}</div>
    <button class="primary-btn" id="primary-btn">${btnLabel}</button>
    <div id="input-error" class="error-hint"></div>
    <div class="example-heading">예시로 눌러보기</div>
    <div class="example-list">
      ${chips.map((c,i)=>`<button class="example-item${isIn?'':' out'}" onclick="useChip(${i})">
        <div class="ex-text">${escapeHtml(c.text)}</div>
        <div class="ex-note">${escapeHtml(c.note)}</div>
      </button>`).join('')}
    </div>
  `;
  const ta = document.getElementById('msg-input');
  const counter = document.getElementById('char-counter');
  const btn = document.getElementById('primary-btn');
  const errEl = document.getElementById('input-error');

  function refreshCounter(){
    const len = ta.value.length;
    counter.textContent = len + ' / 1000자';
    counter.classList.toggle('warn', len>1000);
    btn.disabled = len===0;
  }
  ta.addEventListener('input', ()=>{ state.inputText = ta.value; refreshCounter(); errEl.textContent=''; });
  refreshCounter();

  btn.addEventListener('click', ()=>{
    let text = ta.value.trim();
    if (!text){ errEl.textContent='메시지를 붙여넣어 주세요'; return; }
    if (text.length<10){ errEl.textContent='조금 더 긴 메시지를 넣어주세요'; return; }
    state.truncated = text.length>1000;
    if (state.truncated) text = text.slice(0,1000);
    state.inputText = text;
    startGeneration();
  });
}

function useChip(i){
  const chips = state.mode==='in' ? INBOUND_CHIPS : OUTBOUND_CHIPS;
  state.inputText = chips[i].text;
  render();
}

function startGeneration(){
  state.pendingPromise = runGeneration(state.mode, state.inputText);
  state.preScore = null;
  state.screen = 'measure';
  render();
}

function renderMeasureScreen(){
  const q = state.mode==='in'
    ? '지금 이 메시지에 답장하고 싶은 정도는?'
    : '지금 이 말을 실제로 보낼 것 같은 정도는?';
  root.innerHTML = `
    <div class="measure-card">
      <div class="card-title">잠시만요</div>
      <div class="card-body">${q}</div>
      <div class="measure-scale" id="scale"></div>
      <div class="scale-labels"><span>전혀 아니다</span><span>매우 그렇다</span></div>
    </div>
    <button class="primary-btn" id="next-btn">다음</button>
    <button class="skip-link" id="skip-btn">답 안 하고 바로 결과 보기</button>
  `;
  const scale = document.getElementById('scale');
  scale.innerHTML = [1,2,3,4,5].map(n=>`<button class="scale-btn" data-n="${n}">${n}</button>`).join('');
  scale.querySelectorAll('.scale-btn').forEach(b=>{
    b.addEventListener('click', ()=>{
      state.preScore = Number(b.dataset.n);
      scale.querySelectorAll('.scale-btn').forEach(x=>x.classList.remove('selected'));
      b.classList.add('selected');
    });
  });
  document.getElementById('next-btn').addEventListener('click', proceedToResult);
  document.getElementById('skip-btn').addEventListener('click', proceedToResult);
}

async function proceedToResult(){
  state.screen = 'loading';
  render();
  try{
    state.result = await state.pendingPromise;
  }catch(e){
    state.result = {source:'fallback', data: state.mode==='in' ? FALLBACK_IN : FALLBACK_OUT};
  }
  const d = state.result.data;
  if (state.mode==='in'){
    state.screen = (d.confidence==='low') ? 'refusal' : 'result';
  } else {
    state.screen = (d.safe===false) ? 'safety' : 'result';
  }
  render();
}

function renderLoadingScreen(){
  const label = state.mode==='in' ? '답장을 준비하고 있어요…' : '문장을 다듬고 있어요…';
  root.innerHTML = `<div class="loading-wrap"><div class="spinner"></div><div>${label}</div></div>`;
}

function backToInput(){
  state.screen = 'input';
  state.inputText = '';
  state.result = null;
  render();
}

function sourceBadge(){
  const r = state.result;
  if (r.source==='llm'){
    const sec = r.elapsedMs != null ? (r.elapsedMs/1000).toFixed(1)+'초' : '';
    return `<div class="live-badge">Claude가 방금 실시간으로 만든 답장이에요${sec ? ' · '+sec : ''}</div>`;
  }
  if (r.source==='keyword'){
    return `<div class="safety-badge">위험 신호가 감지돼 답장 생성 없이 바로 안내드려요</div>`;
  }
  return `<div class="fallback-badge">지금은 API 호출이 안 돼서 예시 답장을 보여드리고 있어요</div>`;
}

    cardHtml = `
      <div class="card">
        <div class="card-title">부모님 마음은 이거였을 수도 있어요</div>
        <div class="card-body">${escapeHtml(d.reading || '')}</div>
        ${d.evidence ? `<div class="evidence-line">다시 생각해볼 만한 표현: "${escapeHtml(d.evidence)}"</div>` : ''}
      </div>`;
  }

  root.innerHTML = `
    ${badge}
    <div class="bubble-row left"><div class="bubble incoming">${escapeHtml(state.inputText)}</div></div>
    ${state.truncated ? '<div class="bubble-caption">1,000자가 넘어 앞부분만 사용했어요</div>' : ''}
    ${cardHtml}
    <div id="reply-list"></div>
    <button class="ghost-btn" id="back-btn">다른 메시지 넣기</button>
    <div class="footer-note">AI가 제안한 하나의 가능성이며 실제 의도와 다를 수 있어요.</div>
  `;
  renderReplyCards(d.replies, 'in');
  document.getElementById('back-btn').addEventListener('click', backToInput);
}

function renderOutboundResult(){
  const d = state.result.data;
  const badge = sourceBadge();
  root.innerHTML = `
    ${badge}
    <div class="bubble-row right"><div class="bubble draft">${escapeHtml(state.inputText)}</div></div>
    <div class="bubble-caption" style="text-align:right;">아직 못 보낸 말</div>
    <div class="card">
      <div class="card-title">이렇게 바꿔봤어요</div>
      <div class="card-body">요구의 내용과 강도, 원문의 어조는 그대로 두고 표현만 다듬었어요.</div>
    </div>
    <div id="reply-list"></div>
    <button class="ghost-btn" id="back-btn">다른 말 넣기</button>
    <div class="footer-note">직접 문장을 고쳐 쓸 수 있고, 저장하지 않습니다.</div>
  `;
  renderReplyCards(d.messages, 'out');
  document.getElementById('back-btn').addEventListener('click', backToInput);
}

function renderOutboundSafety(){
  const d = state.result.data;
  const m = d.messages[0];
  root.innerHTML = `
    ${sourceBadge()}
    <div class="bubble-row right"><div class="bubble draft">${escapeHtml(state.inputText)}</div></div>
    <div class="bubble-caption" style="text-align:right;">아직 못 보낸 말</div>
    <div class="card caution-card">
      <div class="card-title">카톡 한 통으로 될 이야기가 아닐 수 있어요</div>
      <div class="card-body">${escapeHtml(d.caution || '')}</div>
    </div>
    <div class="reply-card">
      <div class="reply-label">관계를 닫지 않는 최소한의 말</div>
      <div class="reply-text" contenteditable="true">${escapeHtml(m.text)}</div>
      <div class="reply-actions">
        <button class="icon-btn" onclick="copyCard(this)">복사</button>
        <span class="copy-toast">복사됐어요</span>
      </div>
    </div>
    <button class="ghost-btn" id="back-btn">다른 말 넣기</button>
  `;
  document.getElementById('back-btn').addEventListener('click', backToInput);
}

/* ---- 답장 카드 렌더 + 상호작용 ---- */
function renderReplyCards(items, mode){
  const list = document.getElementById('reply-list');
  list.innerHTML = items.map((item,i)=>{
    const outcomeOrHeard = mode==='in' ? item.outcome : item.heard_as;
    const outcomeLabel = mode==='in' ? '이 답장을 보내면 →' : '상대는 이렇게 들을 수 있어요 →';
    return `
    <div class="reply-card" data-index="${i}" data-type="${escapeHtml(item.type)}" style="order:${i}">
      <div class="reply-label">${escapeHtml(item.type)}</div>
      <div class="reply-text" contenteditable="true">${escapeHtml(item.text)}</div>
      <div class="outcome-line">${outcomeLabel} ${escapeHtml(outcomeOrHeard)}</div>
      <div class="reply-actions">
        <button class="icon-btn" onclick="copyCard(this)">복사</button>
        <button class="icon-btn" onclick="regenCard(this,'${mode}')">다시 생성</button>
        <span class="copy-toast">복사됐어요</span>
        <div class="rating-row" aria-label="보내고 싶은 정도">
          ${[1,2,3,4,5].map(n=>`<button class="rating-btn" data-n="${n}" onclick="rateCard(this,'${mode}')">${n}</button>`).join('')}
        </div>
      </div>
    </div>`;
  }).join('');
  list.style.display='flex';
  list.style.flexDirection='column';
  list.style.gap='10px';
}

async function copyCard(btn){
  const card = btn.closest('.reply-card');
  const text = card.querySelector('.reply-text').innerText;
  const toast = card.querySelector('.copy-toast');
  try{
    await navigator.clipboard.writeText(text);
    toast.classList.add('show');
    setTimeout(()=>toast.classList.remove('show'), 1600);
  }catch(e){
    const el = card.querySelector('.reply-text');
    const range = document.createRange();
    range.selectNodeContents(el);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    toast.textContent = '길게 눌러 복사해주세요';
    toast.classList.add('show');
  }
}

function rateCard(btn, mode){
  const card = btn.closest('.reply-card');
  const type = card.dataset.type;
  const n = Number(btn.dataset.n);
  card.querySelectorAll('.rating-btn').forEach(b=>b.classList.toggle('selected', b===btn));

  if (!state.ratings[mode]) state.ratings[mode]={};
  if (!state.ratingCounts[mode]) state.ratingCounts[mode]={};
  const prevAvg = state.ratings[mode][type] || 0;
  const prevCount = state.ratingCounts[mode][type] || 0;
  const newCount = prevCount+1;
  const newAvg = (prevAvg*prevCount + n) / newCount;
  state.ratings[mode][type] = newAvg;
  state.ratingCounts[mode][type] = newCount;

  reorderCards(mode);
}

function reorderCards(mode){
  const list = document.getElementById('reply-list');
  if (!list) return;
  const cards = Array.from(list.querySelectorAll('.reply-card'));
  const scores = state.ratings[mode] || {};
  cards.sort((a,b)=> (scores[b.dataset.type]||0) - (scores[a.dataset.type]||0));
  cards.forEach((c,i)=>{ c.style.order = i; });
}

async function regenCard(btn, mode){
  const card = btn.closest('.reply-card');
  const type = card.dataset.type;
  const textEl = card.querySelector('.reply-text');
  const outcomeEl = card.querySelector('.outcome-line');
  btn.disabled = true;
  btn.textContent = '생성 중…';

  let variantHint = '';
  if (mode==='in' && type==='이건 어때요'){
    const cur = card.dataset.variant || '온건';
    const next = cur==='온건' ? '도전' : '온건';
    card.dataset.variant = next;
    variantHint = next==='도전'
      ? '이번엔 도전형으로 써줘 — 이번 한 번이 아니라 반복될 요구의 구조 자체를 자녀가 통제 가능한 새 규칙으로 다시 쓰는 문장으로.'
      : '이번엔 온건형으로 써줘 — 자녀가 부담 없이 바로 실행할 수 있는 소극적인 대안으로.';
  }

  try{
    const json = await regenerateOne(mode, state.inputText, type, variantHint);
    if (!json || !json.text) throw new Error('형식 오류');
    textEl.innerText = json.text;
    const label = mode==='in' ? '이 답장을 보내면 →' : '상대는 이렇게 들을 수 있어요 →';
    outcomeEl.textContent = label + ' ' + (json.outcome || json.heard_as || '');
  }catch(e){
    // 재생성 실패: 살짝 표현만 바꾼 대체 문장으로 폴백
    textEl.innerText = textEl.innerText + ' (다시 표현을 다듬어봤어요.)';
  }finally{
    btn.disabled = false;
    btn.textContent = '다시 생성';
  }
}

/* ============================================================
   초기화
============================================================ */
render();
</script>
